name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { $version = '0.0.0' }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $short = $env:GITHUB_SHA.Substring(0, 7)
            $version = "$version+$short"
          }
          $msiVersion = ($version -split '\+')[0]

          $md5 = [System.Security.Cryptography.MD5]::Create()
          $hash = $md5.ComputeHash([Text.Encoding]::UTF8.GetBytes("APM Tracker $env:GITHUB_SHA"))
          $productCode = ([guid]::new([byte[]]$hash)).ToString().ToUpper()

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_version=$msiVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "product_code=$productCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure LLVM/clang++ is available
        shell: pwsh
        run: |
          $onPath = Get-Command clang++ -ErrorAction SilentlyContinue
          $fallback = Join-Path $env:ProgramFiles 'LLVM\bin\clang++.exe'
          if (-not $onPath -and -not (Test-Path -LiteralPath $fallback)) {
            Write-Host "clang++ not found, installing LLVM..."
            choco install llvm -y --no-progress
          }

      - name: Check formatting
        shell: pwsh
        run: |
          $files = @('main.cpp','counter.cpp','counter.h','settings.cpp','settings.h',
                     'session.cpp','session.h','log.cpp','log.h','rec.cpp','rec.h',
                     'eapm.cpp','eapm.h','tests/counter_tests.cpp')
          $clangFormat = (Get-Command clang-format -ErrorAction SilentlyContinue).Source
          if (-not $clangFormat) {
            $clangFormat = Join-Path $env:ProgramFiles 'LLVM\bin\clang-format.exe'
          }
          & $clangFormat --dry-run --Werror @files
          if ($LASTEXITCODE -ne 0) { throw "clang-format check failed" }

      - name: Build and run tests
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Test -Version "${{ steps.version.outputs.version }}"

      - name: Build installer (MSI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet tool uninstall --global wix 2>$null | Out-Null
          dotnet tool install --global wix --version 5.0.2
          $ErrorActionPreference = 'Stop'
          ./installer/build-installer.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -ProductCode "${{ steps.version.outputs.product_code }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apm-tracker-win64-${{ steps.version.outputs.version }}
          path: |
            Release/win64/actions-per-minute-tracker.exe
            Release/win64/apm-tracker-*.msi
          if-no-files-found: error

      - name: Remove stale portable exe from latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset latest actions-per-minute-tracker.exe `
            --repo "${{ github.repository }}" --yes 2>$null
          exit 0

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Release/win64/apm-tracker-*.msi

      - name: Publish latest release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (v${{ steps.version.outputs.version }})
          body: |
            Automatically built from the latest commit on `main`.

            - Version: `${{ steps.version.outputs.version }}`
            - Commit: ${{ github.sha }}
          prerelease: true
          fail_on_unmatched_files: true
          files: Release/win64/apm-tracker-*.msi
